#@TYPE: Machine
#@NAME: Lenovo ThinkServer RD450X BMC
#@DESCRIPTION: ASPEED AST2400, 32 MB SPI NOR (MX25L25635E), NC-SI on MAC1

KMACHINE = "aspeed"
KERNEL_DEVICETREE = "aspeed/${KMACHINE}-bmc-lenovo-${MACHINE}.dtb"

require conf/machine/include/ast2400.inc
require conf/machine/include/obmc-bsp-common.inc

PREFERRED_PROVIDER_virtual/bootloader = "u-boot-aspeed"
PREFERRED_PROVIDER_u-boot = "u-boot-aspeed"
PREFERRED_PROVIDER_u-boot-fw-utils = "u-boot-fw-utils-aspeed"

# The BMC is reached through the host's Intel NIC over NC-SI (MAC1).
UBOOT_MACHINE = "ast_g4_ncsi_config"
UBOOT_ENTRYPOINT = "0x40008000"
UBOOT_LOADADDRESS = "0x40008000"

FLASH_SIZE = "32768"
# Custom static layout (see the device tree): kernel 4.5 MB, read-only
# filesystem 25 MB, writable filesystem 2 MB.
FLASH_ROFS_OFFSET = "5120"
FLASH_RWFS_OFFSET = "30720"

# BMC debug console is UART5, as in the stock firmware (which used 38400).
SERIAL_CONSOLES = "115200;ttyS4"

MACHINE_FEATURES += "obmc-host-ipmi"
PREFERRED_PROVIDER_virtual/obmc-host-ipmi-hw ?= "phosphor-ipmi-kcs"

VIRTUAL-RUNTIME_obmc-host-state-manager ?= "x86-power-control"
VIRTUAL-RUNTIME_obmc-chassis-state-manager ?= "x86-power-control"

PREFERRED_PROVIDER_virtual/obmc-flash-mgmt = "packagegroup-rd450x-apps"
PREFERRED_PROVIDER_virtual/obmc-system-mgmt = "packagegroup-rd450x-apps"

VIRTUAL-RUNTIME_obmc-inventory-manager = "entity-manager"
PREFERRED_PROVIDER_virtual/obmc-inventory-data = "entity-manager"
VIRTUAL-RUNTIME_obmc-sensors-hwmon = "phosphor-hwmon"

# Host serial console: host UART1 is routed to the BMC's UART3
OBMC_CONSOLE_HOST_TTY = "ttyS2"

# Fans are regulated by phosphor-pid-control (JSON configuration in the layer).
VIRTUAL-RUNTIME_obmc-fan-control = "phosphor-pid-control"

# No fan presence detection daemon: phosphor-fan is not configured for this
# board and the flash is nearly full.
VIRTUAL-RUNTIME_obmc-fan-presence = ""

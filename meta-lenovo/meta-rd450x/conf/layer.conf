# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "rd450x-layer"
BBFILE_PATTERN_rd450x-layer = "^${LAYERDIR}/"
LAYERVERSION_rd450x-layer = "1"
LAYERSERIES_COMPAT_rd450x-layer = "wrynose whinlatter"

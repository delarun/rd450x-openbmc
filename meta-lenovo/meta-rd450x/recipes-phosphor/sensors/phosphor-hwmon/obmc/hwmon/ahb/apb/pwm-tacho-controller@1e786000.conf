# Tach inputs with a fan on them. fan4 (SYS_FAN1) has no tach signal on this
# board and is left out.
LABEL_fan1 = "CPU0_FAN"
LABEL_fan2 = "CPU1_FAN"
LABEL_fan5 = "SYS_FAN2"
LABEL_fan6 = "SYS_FAN3"
LABEL_fan7 = "SYS_FAN4"
# A stalled fan makes the driver return ETIMEDOUT: drop that sensor from
# D-Bus (the fan controller then fails safe) instead of exiting.
REMOVERCS = "110"
